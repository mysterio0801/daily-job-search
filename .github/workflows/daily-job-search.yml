name: daily-job-search

on:
  schedule:
    # 07:00 IST = 01:30 UTC, weekdays only. Edit this line for your own timezone --
    # GitHub reads this file directly to schedule runs, it can't come from config/profile.local.yaml.
    - cron: "30 1 * * 1-5"
  workflow_dispatch:
    inputs:
      window:
        description: "Posting window"
        type: choice
        options: ["24h", "48h", "72h"]
        default: "24h"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # config/profile.local.yaml is gitignored (it's personal data) so it never
      # reaches this checkout. Store its contents as the PROFILE_YAML secret --
      # e.g. `gh secret set PROFILE_YAML < config/profile.local.yaml` -- and this
      # step reconstitutes the file before the run. Without the secret set, the
      # pipeline falls back to the tracked example/demo profile, same as locally.
      - name: Restore personal profile
        env:
          PROFILE_YAML: ${{ secrets.PROFILE_YAML }}
        run: |
          if [ -n "$PROFILE_YAML" ]; then
            printf '%s' "$PROFILE_YAML" > config/profile.local.yaml
          else
            echo "PROFILE_YAML secret not set -- running with the example demo profile" >&2
          fi

      - name: Run pipeline
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python daily_job_search.py \
            --window "${{ inputs.window || '24h' }}" \
            --out "job-matches-$(date +%F).xlsx" \
            | tee run.log

      - name: Upload tracker
        uses: actions/upload-artifact@v4
        with:
          name: job-matches-${{ github.run_number }}
          path: |
            job-matches-*.xlsx
            run.log
          retention-days: 30

      # Opt-in: only runs if you set the repo variable ENABLE_EMAIL_NOTIFY=true
      # (Settings -> Secrets and variables -> Actions -> Variables) and add the
      # MAIL_USERNAME / MAIL_APP_PASSWORD / MAIL_TO secrets. See README for setup.
      - name: Email the tracker
        if: success() && vars.ENABLE_EMAIL_NOTIFY == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_APP_PASSWORD }}
          from: Job Search Bot
          to: ${{ secrets.MAIL_TO }}
          subject: "Job matches — ${{ github.run_number }}"
          body: file://run.log
          attachments: job-matches-*.xlsx
